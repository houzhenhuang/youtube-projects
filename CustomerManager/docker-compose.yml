version: '3.4'

services:
  customermanager-api:
    image: ${DOCKER_REGISTRY-}customermanager-api
    container_name: CustomerManager.Api
    build:
      context: ..
      dockerfile: CustomerManager/src/CustomerManager.Api/Dockerfile
    environment:
      # - OTEL_EXPORTER_OTLP_ENDPOINT=http://customermanager-jaeger:4317
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://customermanager-aspire-dashboard:18889
  customermanager-database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: CustomerManager.Database
    volumes: 
      - ./.containers/database:/var/opt/mssql/data
    ports:
      - "1433:1433"
    environment: 
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Strong_password_123!"
  customermanager-jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: CustomerManager.Jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
  customermanager-aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.0
    container_name: CustomerManager.Aspire.Dashboard
    ports:
      - "18888:18888"
      - "18889:18889"
  prometheus:
      image: prom/prometheus
      container_name: CustomerManager.Prometheus
      hostname: prometheus
      restart: always
      volumes:
          - ./prometheus.yml:/etc/prometheus/prometheus.yml
      ports:
          - "9090:9090"
  