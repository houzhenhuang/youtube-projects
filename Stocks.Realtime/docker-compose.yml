services:
  stocks.realtime.api:
    image: ${DOCKER_REGISTRY-}stocksrealtimeapi
    container_name: Stocks.Realtime.Api
    build:
      context: .
      dockerfile: Stocks.Realtime.Api/Dockerfile
    ports:
      - 5000:8080
      - 5001:8081

  stocks.realtime.postgres:
    image: postgres:latest
    container_name: Stocks.Database
    environment:
      - POSTGRES_DB=stocks
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - ./.containers/data:/var/lib/postgresql/

    ports:
      - 5432:5432