services:
  contentplatform-api:
    image: ${DOCKER_REGISTRY-}contentplatformapi
    container_name: ContentPlatform.Api
    build:
      context: .
      dockerfile: ContentPlatform.Api/Dockerfile
    ports:
      - "5000:8080"
      - "5001:8081"
    environment: 
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://contentplatform-jaeger:4317
      - OTEL_DOTNET_EXPERIMENTAL_EFCORE_ENABLE_TRACE_DB_QUERY_PARAMETERS=true

  contentplatform-reporting-api:
    image: ${DOCKER_REGISTRY-}contentplatformreportingapi
    container_name: ContentPlatform.Reporting.Api
    build:
      context: .
      dockerfile: ContentPlatform.Reporting.Api/Dockerfile
    ports:
      - "7000:8080"
      - "7001:8081"
    environment: 
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://contentplatform-jaeger:4317
      - OTEL_DOTNET_EXPERIMENTAL_EFCORE_ENABLE_TRACE_DB_QUERY_PARAMETERS=true
 
  contentplatform-db:
    image: postgres:latest
    container_name: ContentPlatform.Db
    environment:
      - POSTGRES_DB=contentplatform
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - ./.containers/data:/var/lib/postgresql/
    ports:
      - 5432:5432

  contentplatform-mq:
    image: rabbitmq:management
    container_name: ContentPlatform.RabbitMq
    hostname: contentplatform-mq
    volumes:
      - ./.containers/queue/data/:/var/lib/rabbitmq
      - ./.containers/queue/log/:/var/log/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
  contentplatform-jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: ContentPlatform.Jaeger
    ports:
      - 4317:4317
      - 4318:4318
      - 16686:16686
  contentplatform-consul:
    image: hashicorp/consul:latest
    container_name: ContentPlatform.Consul
    ports:
      - 8500:8500
      - 8600:8600